# =============================================================================
# Oasis RL Finetuning Configuration - SINGLE SOURCE OF TRUTH
# =============================================================================
# All hyperparameters are defined here. Do NOT hardcode values in Python files.
# Command-line arguments can override these values.
# =============================================================================

# -----------------------------------------------------------------------------
# Model Paths
# -----------------------------------------------------------------------------
model:
  ddim_steps: 4             # DDIM denoising steps (default 10, reduce for speed)
  oasis_ckpt: "/home/rd3629/.cache/huggingface/hub/models--Etched--oasis-500m/snapshots/4ca7d2d811f4f0c6fd1d5719bf83f14af3446c0c/oasis500m.safetensors"
  vae_ckpt: "/home/rd3629/.cache/huggingface/hub/models--Etched--oasis-500m/snapshots/4ca7d2d811f4f0c6fd1d5719bf83f14af3446c0c/vit-l-20.safetensors"
  dit_type: "DiT-S/2"

# -----------------------------------------------------------------------------
# Reward Configuration
# -----------------------------------------------------------------------------
reward:
  models_dir: "models_for_rl_finetuning"
  idm_model_path: "models_for_rl_finetuning/4x_idm.model"
  idm_weights_path: "models_for_rl_finetuning/4x_idm.weights"
  require_vpt: true
  # GameWorldScore component weights
  rik_weight: 1.0           # Inverse Kinematics (action fidelity)
  rtc_weight: 0             # Temporal Consistency (CLIP similarity)
  raq_weight: 0             # Aesthetic Quality (LAION aesthetic)
  rrg_weight: 0           # Reality Grounding (anti-drift) - NEW!
  use_motion_smoothness: true
  add_reward_noise: true    # Add small noise to break reward ties

# -----------------------------------------------------------------------------
# Data Configuration
# -----------------------------------------------------------------------------
data:
  data_dir: "Dataset/screenshots"
  dataset_type: "screenshots"      # screenshots, auto, video, or midas
  train_batch_size: 1
  n_prompt_frames: 1
  max_gen_frames: 2         # Reduced for memory optimization
  frame_height: 360
  frame_width: 640
  num_workers: 4

# -----------------------------------------------------------------------------
# Training Configuration
# -----------------------------------------------------------------------------
training:
  total_epochs: 10
  total_training_steps: 10000
  learning_rate: 1.0e-5     # Reduced - 1e-4 caused gradient explosion
  weight_decay: 0.01
  grad_clip: 0.5            # Stricter clipping to prevent explosion
  device: "cuda"

# -----------------------------------------------------------------------------
# GRPO Hyperparameters
# -----------------------------------------------------------------------------
grpo:
  group_size: 4             # Number of rollouts per prompt
  grpo_epochs: 3            # MUST be >1 for ratio to change within step
  update_micro_batch_size: 4  # MUST equal group_size for balanced advantages
  gamma: 0.99
  lam: 0.95
  clip_ratio: 0.2
  log_ratio_clip: 2.0       # Clamp log(ratio) to prevent exp() overflow
  entropy_coeff: 0.001
  reward_scale: 10.0        # Reduced from 100 - was causing gradient explosion
  adv_estimator: "grpo"     # grpo, reinforce_plus_plus, or gae

# -----------------------------------------------------------------------------
# KL Regularization
# -----------------------------------------------------------------------------
kl:
  use_kl_in_reward: true
  kl_coeff: 0.01
  kl_target: 0.1
  kl_compute_freq: 5        # Compute KL every N steps

# -----------------------------------------------------------------------------
# Memory Optimization
# -----------------------------------------------------------------------------
memory:
  use_gradient_checkpointing: true
  use_mixed_precision: true
  offload_reward_to_cpu: false
  offload_ref_policy_to_cpu: false   # Saves ~14GB GPU memory
  cache_encoded_frames: false       # DISABLED: breaks gradient flow
  use_torch_compile: false
  enable_tf32: true

# -----------------------------------------------------------------------------
# Checkpointing
# -----------------------------------------------------------------------------
checkpoint:
  save_freq: 100
  test_freq: 50
  checkpoint_dir: "checkpoints/oasis_grpo"
  auto_resume: true         # Automatically resume from latest checkpoint

# -----------------------------------------------------------------------------
# Video Saving
# -----------------------------------------------------------------------------
video:
  save_freq: 50
  save_dir: "samples"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  project_name: "oasis_rl_finetuning"
  experiment_name: "grpo_gameworldscore"
  use_wandb: true
  log_interval: 10
